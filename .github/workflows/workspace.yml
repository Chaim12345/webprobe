name: Workspace acceptance

on:
  pull_request:
  push:
    branches: ["parity/**"]

permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight. Pushes to a
# long-lived branch each get their own group, so a merge is never left with a
# cancelled acceptance run.
concurrency:
  group: workspace-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI builds each commit once: incremental state only adds to the cache.
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_RUSTC: rustc
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
  RUSTFLAGS: ""
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  RUSTUP_TOOLCHAIN: '1.100.0'

defaults:
  run:
    working-directory: app
    shell: bash

jobs:
  changes:
    name: CI change scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_ci: ${{ steps.scope.outputs.run_ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Test change classifier
        working-directory: ${{ github.workspace }}
        run: python3 scripts/test-ci-change-scope.py
      - name: Classify changed paths (uncertainty runs full CI)
        id: scope
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci-change-scope.py

  workspace:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_ci != 'false') }}
    name: workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record tested commit
        run: git rev-parse HEAD
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev
      - name: Install pinned Rust and checks
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: workspace-${{ runner.os }}-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: workspace-${{ runner.os }}-
      - name: "Architecture ratchet (ADR 0002): cycles and structural counts only go down"
        run: |
          python3 ../scripts/test-arch-gate.py
          python3 ../scripts/arch-gate.py
      - name: "Scanner issue-type coverage (roadmap F-08): a covered Burp issue type may not lose its check"
        run: python3 ../scripts/issue-coverage.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Execute all default-feature workspace tests, unfiltered
        run: cargo test --workspace --locked

  jvm-bridge:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_ci != 'false') }}
    name: jvm-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record tested commit
        run: git rev-parse HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: rustup toolchain install 1.100.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: jvm-bridge-${{ runner.os }}-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: jvm-bridge-${{ runner.os }}-
      - name: Restore and verify pinned Montoya test API
        uses: ./.github/actions/montoya-api
      - name: Check JVM gate failure detection
        run: python3 ../scripts/test-ci-jvm-tests.py
      - name: Execute existing Montoya stage contracts, reject skips and empty filters
        env:
          WEBPROBE_REQUIRE_JAVA: '1'
          WEBPROBE_BURP_JAR: ${{ runner.temp }}/montoya-api.jar
        run: python3 ../scripts/ci-jvm-tests.py
