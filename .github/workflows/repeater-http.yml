name: Repeater Montoya regression

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repeater-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI builds each commit once: incremental state only adds to the cache.
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_RUSTC: rustc
  CARGO_BUILD_RUSTC_WRAPPER: ""
  # Match workspace acceptance's linker so its desktop dependencies are reusable.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
  RUSTFLAGS: ""
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: CI change scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_ci: ${{ steps.scope.outputs.run_ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Test change classifier
        working-directory: ${{ github.workspace }}
        run: python3 scripts/test-ci-change-scope.py
      - name: Classify changed paths (uncertainty runs full CI)
        id: scope
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci-change-scope.py

  repeater-http:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_ci != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - name: Identify Rust cache toolchain
        id: rust-cache-toolchain
        run: echo "fingerprint=$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache Repeater Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: repeater-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache-toolchain.outputs.fingerprint }}-${{ hashFiles('app/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml') }}
          # PR-only caches cannot warm another PR. Consume the desktop cache
          # produced by workspace.yml on parity instead; Cargo checks freshness.
          restore-keys: |
            repeater-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache-toolchain.outputs.fingerprint }}-
            workspace-${{ runner.os }}-${{ hashFiles('app/Cargo.lock') }}
            cargo-${{ runner.os }}-stable-${{ hashFiles('app/Cargo.lock') }}
      - name: Restore and verify pinned Montoya test API
        uses: ./.github/actions/montoya-api
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --no-run
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Real JVM and loopback Repeater HTTP handlers
        env:
          WEBPROBE_REQUIRE_JAVA: '1'
          WEBPROBE_BURP_JAR: ${{ runner.temp }}/montoya-api.jar
        run: cargo test --locked --bin webprobe repeater_ -- --test-threads=1 --nocapture
