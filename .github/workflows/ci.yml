name: CI

on:
  push:
    branches: [master, "parity/**", "roadmap/**"]
  pull_request:

# app/.cargo/config.toml pins a machine-local rustc, sccache and ld.lld-22.
# These overrides make the repo build on a fresh runner. (An empty
# RUSTFLAGS replaces the linker flags from that file.)
env:
  CARGO_BUILD_RUSTC: rustc
  CARGO_BUILD_RUSTC_WRAPPER: ""
  RUSTFLAGS: ""
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: app

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.95.0", stable]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy && rustup default ${{ matrix.toolchain }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: cargo-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.toolchain }}-
      # webprobe-core has no UI dependency, so no system libraries are needed.
      - run: cargo check -p webprobe-core --locked
      # Verify every workspace target, including the optional MCP integration,
      # at the declared MSRV as well as stable. Check needs no running display.
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test -p webprobe-core --locked --no-run
      # Zero-warning policy (issue #33): clippy is blocking.
      - run: cargo clippy -p webprobe-core --locked --all-targets -- -D warnings
