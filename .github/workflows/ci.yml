name: CI

on:
  push:
    branches: [master, "parity/**", "roadmap/**"]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes the run in flight. Pushes to a
# long-lived branch each get a group of their own (the run id), so none is
# cancelled or dropped while queued: every merged commit keeps its result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# app/.cargo/config.toml pins a machine-local rustc, sccache and ld.lld-22.
# These overrides make the repo build on a fresh runner. (An empty
# RUSTFLAGS replaces the linker flags from that file.)
env:
  # CI builds each commit once: incremental state only adds to the cache.
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_RUSTC: rustc
  CARGO_BUILD_RUSTC_WRAPPER: ""
  RUSTFLAGS: ""
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: app

jobs:
  changes:
    name: CI change scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_ci: ${{ steps.scope.outputs.run_ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Test change classifier
        working-directory: ${{ github.workspace }}
        run: python3 scripts/test-ci-change-scope.py
      - name: Classify changed paths (uncertainty runs full CI)
        id: scope
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci-change-scope.py

  core:
    needs: changes
    # Expand both toolchains even for docs-only changes, preserving check names.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Each toolchain reports on its own: a failure on one does not cancel
      # the other.
      fail-fast: false
      matrix:
        toolchain: ["1.95.0", stable]
        include:
          # #[expect] is checked on stable only. An older compiler flags
          # less dead code, so on the MSRV toolchain an expectation that
          # stable fulfils is reported as unfulfilled.
          - toolchain: "1.95.0"
            clippy_extra: "-A unfulfilled_lint_expectations"
          - toolchain: stable
            clippy_extra: ""
    steps:
      - uses: actions/checkout@v4
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.run_ci != 'false' }}
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy && rustup default ${{ matrix.toolchain }}
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.run_ci != 'false' }}
      - uses: actions/cache@v4
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.run_ci != 'false' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: cargo-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.toolchain }}-
      # Clippy type-checks everything it lints, so no separate cargo check
      # runs first. Zero-warning policy (issue #33): clippy is blocking.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings ${{ matrix.clippy_extra }}
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.run_ci != 'false' }}
      # The engine on its own, without the features the desktop crate turns
      # on: it must build and lint clean with no UI dependency.
      - run: cargo clippy -p webprobe-core --locked --all-targets -- -D warnings ${{ matrix.clippy_extra }}
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.run_ci != 'false' }}
      # These tests must run in a real JVM, not pass by skipping prerequisites.
      - uses: actions/setup-java@v4
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.run_ci != 'false' }}
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore and verify pinned Montoya test API
        uses: ./.github/actions/montoya-api
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.run_ci != 'false' }}
      - name: Montoya public API regressions (required)
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.run_ci != 'false' }}
        env:
          WEBPROBE_REQUIRE_JAVA: '1'
          WEBPROBE_BURP_JAR: ${{ runner.temp }}/montoya-api.jar
        run: cargo test -p webprobe-core --locked ext_host::tests::montoya_ -- --test-threads=1
  # Known-vulnerable dependencies fail the build (issue #251). Unmaintained
  # crates are reported as warnings and do not fail it.
  advisories:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_ci != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-0.23.0
      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --version 0.23.0 --locked
      - run: cargo audit

  bambda:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_ci != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - name: Identify Rust cache toolchain
        id: rust-cache-toolchain
        run: echo "fingerprint=$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache Bambda Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: bambda-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache-toolchain.outputs.fingerprint }}-${{ hashFiles('app/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml') }}
          restore-keys: |
            bambda-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache-toolchain.outputs.fingerprint }}-
            cargo-${{ runner.os }}-stable-${{ hashFiles('app/Cargo.lock') }}
            cargo-${{ runner.os }}-stable-
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore and verify pinned Montoya test API
        uses: ./.github/actions/montoya-api
        with:
          url: https://repo1.maven.org/maven2/net/portswigger/burp/extensions/montoya-api/2026.7/montoya-api-2026.7.jar
      - name: Test real Java Bambda compilation and evaluation
        run: |
          WEBPROBE_BAMBDA_TEST_JAVA="$JAVA_HOME/bin/java" \
          WEBPROBE_BAMBDA_TEST_API="$RUNNER_TEMP/montoya-api.jar" \
          cargo test -p webprobe-core --test bambda --locked -- --ignored --test-threads=2
