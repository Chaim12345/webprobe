[package]
name = "webprobe-support"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Test builds keep the CA in memory: no test reads or writes the user CA.
test-ca = []

# Stage A (#37): acyclic leaf modules extracted from webprobe-core so the
# core crate is smaller and these compile in parallel. No dependency on
# webprobe-core; anything engine-facing stays in core.
[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
flate2.workspace = true
memmap2.workspace = true
rand.workspace = true
rcgen.workspace = true
regex.workspace = true
ring.workspace = true
rsa.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Decoder Hash menu parity (Burp 2026.11.2, 82 entries).
blake2 = "0.10"
blake3 = "1"
gost94 = "0.10"
kupyna = "0.1"
md2 = "0.10"
md4 = "0.10"
md-5 = "0.10"
ripemd = "0.1"
sha1 = "0.10"
sha3 = "0.10"
skein-hash = "0.3"
sm3 = "0.4"
streebog = "0.10"
tiger = "0.2"
tiny-keccak = { version = "2", features = ["keccak", "cshake", "tuple_hash", "parallel_hash", "sp800"] }
whirlpool = "0.10"
keccak = "0.1"
time.workspace = true
webpki-roots.workspace = true
x509-parser.workspace = true

# poll(2) with POLLRDHUP: the only way to see a peer's FIN behind unread
# bytes (a TLS close_notify) without consuming them.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1", features = ["event"] }
