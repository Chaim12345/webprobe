[package]
name = "webprobe"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11"] }
egui_glow = "0.29"
brotli = "7"
flate2 = "1"
hpack = "0.3"
regex = "1"
rcgen = "0.13"
rand = "0.8"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
time = "0.3"
webpki-roots = "0.26"

[profile.release]
opt-level = 2
